# 2. 参数模式 302 临时重定向 (/go.html?id=:id)
location = /go.html {
    if ($arg_id = "huanqiuti") { return 302 "https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0"; }
    if ($arg_id = "hq")        { return 302 "https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0"; }

    if ($arg_id = "dalaoyun")  { return 302 "https://ppsvip01.dalaoyunaff.com/#/?code=Iz1GlCVa"; }
    if ($arg_id = "dly")       { return 302 "https://ppsvip01.dalaoyunaff.com/#/?code=Iz1GlCVa"; }

    if ($arg_id = "liulianyun") { return 302 "https://123pp01.liulianyunaff.com/#/?code=MsZP3u7G"; }
    if ($arg_id = "ll")         { return 302 "https://123pp01.liulianyunaff.com/#/?code=MsZP3u7G"; }

    if ($arg_id = "yunjiexian") { return 302 "https://pp01.yunjiexianaff.com/#/?code=6Y9vSMcc"; }
    if ($arg_id = "yjx")        { return 302 "https://pp01.yunjiexianaff.com/#/?code=6Y9vSMcc"; }

    if ($arg_id = "shandianshu") { return 302 "https://ppsvip01.shandianshuaff.com/#/?code=QbLF8tjB"; }
    if ($arg_id = "sds")         { return 302 "https://ppsvip01.shandianshuaff.com/#/?code=QbLF8tjB"; }

    if ($arg_id = "shenxing")   { return 302 "https://pps123.shenxingaff.com/#/?code=6tQ7zHUc"; }
    if ($arg_id = "sx")         { return 302 "https://pps123.shenxingaff.com/#/?code=6tQ7zHUc"; }

    # 防止爬虫索引此承接文件
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
}

