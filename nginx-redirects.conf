# 1. 路径模式 302 临时重定向 (/go/:id)
location = /go/huanqiuti { return 302 "https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0"; }
location = /go/hq        { return 302 "https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0"; }

location = /go/dalaoyun  { return 302 "https://ppsvip01.dalaoyunaff.com/#/?code=Iz1GlCVa"; }
location = /go/dly       { return 302 "https://ppsvip01.dalaoyunaff.com/#/?code=Iz1GlCVa"; }

location = /go/liulianyun { return 302 "https://123pp01.liulianyunaff.com/#/?code=MsZP3u7G"; }
